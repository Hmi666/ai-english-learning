# ============================================================================
# pnpm 配置（pnpm 11 起，包管理与构建设置统一放在本文件）
#
# 团队统一使用 pnpm，不使用 npm / yarn，避免出现多套锁文件。
# 锁文件：pnpm-lock.yaml，必须提交到版本库。
# ============================================================================

# 受限的 workspace 声明：前端是一个独立包，不拆分 workspace 子包。
packages: []

# pnpm 10 起默认禁止依赖执行安装脚本（防供应链攻击）。
# 这里逐个显式声明，避免出现「未声明的构建脚本」告警导致 pnpm 以非 0 退出。
#   放行（true）：确实需要执行安装脚本的依赖
#     esbuild  —— Vite 依赖的原生二进制，不放行会导致 dev/build 直接失败
#     vue-demi —— 安装时需按 Vue 版本切换入口文件
#   拒绝（false）：安装脚本只打印赞助/提示信息，对运行没有影响
#     core-js、es5-ext
allowBuilds:
  esbuild: true
  vue-demi: true
  core-js: false
  es5-ext: false
